name: Deploy to VPS

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    name: SSH & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_REF_NAME
          script: |
            set -e

            cd ${{ secrets.APP_DIR }}

            git fetch --tags origin
            git checkout "$GITHUB_REF_NAME"

            docker compose build web celery

            docker compose run --rm --no-deps web python manage.py migrate --noinput

            docker compose run --rm --no-deps web python manage.py collectstatic --noinput

            docker compose up -d --no-deps --remove-orphans web

            CONTAINER=$(docker compose ps -q web)
            for i in $(seq 1 20); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "none")
              echo "health: $STATUS ($i/20)"
              [ "$STATUS" = "healthy" ] && break
              if [ "$STATUS" = "unhealthy" ]; then
                docker compose logs --tail=50 web
                exit 1
              fi
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              docker compose logs --tail=50 web
              exit 1
            fi

            docker compose up -d --no-deps celery
            docker compose up -d --no-deps db redis
            docker image prune -f

            echo "Deployed $GITHUB_REF_NAME"
