services:
  web:
    build: .
    command: gunicorn hta.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --graceful-timeout 30
    volumes:
      - .:/app
      - media_volume:/app/media
      - logs_volume:/app/logs
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # - "traefik.http.routers.bptap-api.rule=Host(`hta.cema.africa`) && PathPrefix(`/api`)"
      - "traefik.http.routers.bptap-api.rule=Host(`hta.cema.africa`) && (PathPrefix(`/api`) || PathPrefix(`/static`) || PathPrefix(`/media`))"
      - "traefik.http.routers.bptap-api.entrypoints=websecure"
      - "traefik.http.routers.bptap-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.bptap-api.loadbalancer.server.port=8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - proxy
    depends_on:
      redis:
        condition: service_started
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    build: .
    entrypoint: []
    command: celery -A hta worker -l info -Q proposals,files,emails,celery
    volumes:
      - .:/app
      - logs_volume:/app/logs
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    networks:
      - proxy

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - proxy

volumes:
  media_volume:
  logs_volume:
  redis_data:

networks:
  proxy:
    external: true